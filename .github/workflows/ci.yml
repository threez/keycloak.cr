name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint & compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: 1.20.2
      - name: Cache shards
        uses: actions/cache@v4
        with:
          path: lib
          key: ${{ runner.os }}-shards-${{ hashFiles('shard.lock') }}
          restore-keys: ${{ runner.os }}-shards-
      - run: shards install
      - name: Build ameba
        run: cd lib/ameba && shards build ameba
      - name: Format check
        run: crystal tool format --check
      - name: Ameba lint
        run: lib/ameba/bin/ameba
      - name: Compile check
        run: crystal build src/keycloak.cr -o /tmp/keycloak_check --no-codegen

  # The spec suite has no pure-unit tests: spec/spec_helper.cr builds the
  # shared Keycloak client against CONFIG_URL at top-level const-init time,
  # so every spec needs a real, reachable Keycloak instance. The configured
  # CONFIG_URL isn't reachable from GitHub's hosted runners, so this job is
  # manual-dispatch only rather than running (and failing) on every push/PR.
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    if: github.event_name == 'workflow_dispatch'
    environment: ci
    steps:
      - uses: actions/checkout@v4
      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: 1.20.2
      - name: Cache shards
        uses: actions/cache@v4
        with:
          path: lib
          key: ${{ runner.os }}-shards-${{ hashFiles('shard.lock') }}
          restore-keys: ${{ runner.os }}-shards-
      - run: shards install
      - name: Run specs
        run: |
          export CONFIG_NAME="${{ vars.CONFIG_NAME }}"
          export CONFIG_URL="${{ vars.CONFIG_URL }}"
          export CONFIG_KEY="${{ secrets.CONFIG_KEY }}"
          crystal spec --order=random
